name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            pkg-config \
            wimtools \
            grub-common \
            grub-pc-bin \
            dosfstools \
            ntfs-3g \
            exfatprogs \
            e2fsprogs \
            btrfs-progs \
            udisks2 \
            xvfb

      - name: Install Python test dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest pytest-cov ruff mypy

      - name: Run linting
        continue-on-error: true
        run: |
          .venv/bin/ruff check yaku/
          .venv/bin/ruff format --check yaku/

      - name: Run type checking
        continue-on-error: true
        run: .venv/bin/mypy yaku/

      - name: Run tests
        run: |
          dbus-run-session -- xvfb-run -a \
            .venv/bin/python -m pytest tests/ -v --cov=yaku --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            gettext \
            python3-dev \
            python3-gi \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgirepository1.0-dev

      - name: Configure Meson
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

      - name: Test install
        run: |
          DESTDIR=/tmp/install meson install -C builddir
          SITE=$(find /tmp/install -type d \( -name site-packages -o -name dist-packages \) | head -n1)
          PYTHONPATH="$SITE" /tmp/install/usr/local/bin/yaku --version

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        run: flatpak-builder --force-clean build-dir com.github.init_d43m0n.yaku.yml

      - name: Test Flatpak
        run: flatpak-builder --run build-dir com.github.init_d43m0n.yaku.yml yaku --version

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Release
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
