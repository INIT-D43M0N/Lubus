name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gobject \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            pkg-config \
            wimlib \
            grub2 \
            dosfstools \
            ntfs-3g \
            exfatprogs \
            e2fsprogs \
            btrfs-progs \
            udisks2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check lubus/
          ruff format --check lubus/

      - name: Run type checking
        run: |
          mypy lubus/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=lubus --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Configure Meson
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

      - name: Test install
        run: |
          DESTDIR=/tmp/install meson install -C builddir
          /tmp/install/usr/local/bin/lubus --version

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean build-dir com.github.yourusername.lubus.yml

      - name: Test Flatpak
        run: |
          flatpak-builder --run build-dir com.github.yourusername.lubus.yml lubus --version

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true