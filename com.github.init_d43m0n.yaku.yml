app-id: com.github.init_d43m0n.yaku
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: yaku
finish-args:
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.portal.Documents
  - --own-name=com.github.init_d43m0n.yaku
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: yaku
    buildsystem: meson
    config-opts:
      - --prefix=/app
    sources:
      - type: dir
        path: .
    # The desktop entry, the AppStream metadata and the icons are installed
    # by meson itself, into /app/share.
